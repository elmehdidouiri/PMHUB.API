<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1160" viewBox="0 0 1400 1160">
  <rect width="1400" height="1160" fill="#edf1f3"/>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#2E4957" flood-opacity="0.16"/>
    </filter>
    <style>
      .ui { font-family: Arial, Helvetica, sans-serif; letter-spacing: 0; }
      .muted { fill: #52616b; }
      .text { fill: #1f2933; }
      .teal { fill: #2E4957; }
      .orange { fill: #E98300; }
    </style>
  </defs>

  <text x="86" y="72" class="ui text" font-size="30" font-weight="700">PMHub - nouveau style email corporate TE Connectivity</text>
  <text x="86" y="105" class="ui muted" font-size="16">Logo TE, TE Orange #E98300, Dark Teal #2E4957, structure email professionnelle et footer automatique.</text>

  <g transform="translate(95 155)" filter="url(#shadow)">
    <rect width="620" height="820" rx="8" fill="#ffffff" stroke="#d9e2ec"/>
    <rect width="620" height="6" rx="3" fill="#E98300"/>
    <rect y="6" width="620" height="208" fill="#2E4957"/>
    <image href="https://www.te.com/_TEincludes/ver/1696/v2/images/te-connectivity-logo.png" x="42" y="38" width="190" height="54" preserveAspectRatio="xMinYMid meet"/>
    <text x="42" y="132" class="ui" font-size="12" font-weight="700" fill="#A4D4E6">PMHUB NOTIFICATION</text>
    <text x="42" y="171" class="ui" font-size="26" font-weight="700" fill="#ffffff">Confirmation de votre adresse email</text>
    <text x="42" y="198" class="ui" font-size="15" fill="#d9e2ec">Finalisez votre inscription PMHub en confirmant votre adresse email.</text>

    <g transform="translate(42 262)">
      <text x="0" y="0" class="ui text" font-size="16">Bonjour Sara,</text>
      <text x="0" y="42" class="ui text" font-size="16">Merci pour votre inscription sur PMHub.</text>
      <text x="0" y="84" class="ui text" font-size="16">Pour activer votre compte et securiser votre acces, veuillez</text>
      <text x="0" y="109" class="ui text" font-size="16">confirmer votre adresse email en cliquant sur le bouton ci-dessous.</text>

      <rect x="0" y="148" width="184" height="46" rx="4" fill="#E98300"/>
      <text x="24" y="177" class="ui" font-size="15" font-weight="700" fill="#ffffff">Confirmer mon email</text>

      <rect x="0" y="238" width="536" height="92" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
      <rect x="0" y="238" width="5" height="92" rx="2" fill="#E98300"/>
      <text x="24" y="275" class="ui muted" font-size="14">Information de securite</text>
      <text x="24" y="306" class="ui text" font-size="15">Ce lien expire dans 24 heures. Si vous n'avez pas cree de compte,</text>
      <text x="24" y="329" class="ui text" font-size="15">vous pouvez ignorer cet email.</text>

      <text x="0" y="392" class="ui text" font-size="16">Cordialement,</text>
      <text x="0" y="420" class="ui teal" font-size="16" font-weight="700">L'equipe PMHub</text>
    </g>

    <rect y="704" width="620" height="116" fill="#f8fafc"/>
    <line x1="0" y1="704" x2="620" y2="704" stroke="#e2e8f0"/>
    <text x="42" y="742" class="ui muted" font-size="13">Cet email automatique a ete envoye par PMHub pour le suivi operationnel TE Connectivity.</text>
    <text x="42" y="773" class="ui muted" font-size="12">Merci de ne pas repondre directement a ce message. Pour assistance, contactez l'administrateur PMHub.</text>
  </g>

  <g transform="translate(790 155)">
    <text x="0" y="0" class="ui text" font-size="22" font-weight="700">Variantes appliquees aux emails existants</text>
    <text x="0" y="30" class="ui muted" font-size="15">Chaque email reutilise le meme cadre corporate avec un contenu adapte.</text>

    <g transform="translate(0 70)" filter="url(#shadow)">
      <rect width="500" height="145" rx="8" fill="#ffffff" stroke="#d9e2ec"/>
      <rect width="500" height="5" rx="2" fill="#E98300"/>
      <rect y="5" width="500" height="58" fill="#2E4957"/>
      <text x="24" y="39" class="ui" font-size="18" font-weight="700" fill="#ffffff">Compte PMHub approuve</text>
      <text x="24" y="92" class="ui text" font-size="15">Bonne nouvelle : votre compte est approuve.</text>
      <rect x="24" y="110" width="120" height="28" rx="4" fill="#E98300"/>
      <text x="42" y="129" class="ui" font-size="12" font-weight="700" fill="#ffffff">Se connecter</text>
    </g>

    <g transform="translate(0 245)" filter="url(#shadow)">
      <rect width="500" height="145" rx="8" fill="#ffffff" stroke="#d9e2ec"/>
      <rect width="500" height="5" rx="2" fill="#E98300"/>
      <rect y="5" width="500" height="58" fill="#2E4957"/>
      <text x="24" y="39" class="ui" font-size="18" font-weight="700" fill="#ffffff">Password reset verification</text>
      <text x="24" y="92" class="ui text" font-size="15">Code de verification mis en avant.</text>
      <rect x="24" y="108" width="160" height="28" rx="4" fill="#f8fafc" stroke="#d9e2ec"/>
      <text x="48" y="129" class="ui orange" font-size="18" font-weight="700">482913</text>
    </g>

    <g transform="translate(0 420)" filter="url(#shadow)">
      <rect width="500" height="165" rx="8" fill="#ffffff" stroke="#d9e2ec"/>
      <rect width="500" height="5" rx="2" fill="#E98300"/>
      <rect y="5" width="500" height="58" fill="#2E4957"/>
      <text x="24" y="39" class="ui" font-size="18" font-weight="700" fill="#ffffff">Rappel de saisie des heures</text>
      <rect x="24" y="82" width="138" height="58" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
      <rect x="181" y="82" width="138" height="58" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
      <rect x="338" y="82" width="138" height="58" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
      <text x="38" y="105" class="ui muted" font-size="12">Saisi</text>
      <text x="38" y="130" class="ui teal" font-size="19" font-weight="700">28 h</text>
      <text x="195" y="105" class="ui muted" font-size="12">Attendu</text>
      <text x="195" y="130" class="ui teal" font-size="19" font-weight="700">40 h</text>
      <text x="352" y="105" class="ui" font-size="12" fill="#9a3412">Restant</text>
      <text x="352" y="130" class="ui orange" font-size="19" font-weight="700">12 h</text>
    </g>

    <g transform="translate(0 615)" filter="url(#shadow)">
      <rect width="500" height="155" rx="8" fill="#ffffff" stroke="#d9e2ec"/>
      <rect width="500" height="5" rx="2" fill="#E98300"/>
      <rect y="5" width="500" height="58" fill="#2E4957"/>
      <text x="24" y="39" class="ui" font-size="18" font-weight="700" fill="#ffffff">Suivi TE Connectivity</text>
      <text x="24" y="94" class="ui text" font-size="15">Action requise sur les bookings ou les heures intern.</text>
      <text x="24" y="126" class="ui teal" font-size="15" font-weight="700">PMHub - TE Connectivity</text>
    </g>
  </g>

  <g transform="translate(95 1035)">
    <circle cx="10" cy="10" r="5" fill="#E98300"/>
    <text x="28" y="15" class="ui muted" font-size="14">Couleurs alignees avec les guidelines TE : TE Orange, Dark Teal, Sky Blue en support.</text>
  </g>
</svg>
