services:
  frontend:
    build:
      context: "${PMHUB_FRONTEND_PATH}"
    image: pmhub-frontend:local
    container_name: pmhub-frontend
    restart: unless-stopped
    stop_grace_period: 30s
    command: ["node", "dist/pmhub-frontend/server/server.mjs"]
    ports:
      - "${PMHUB_FRONTEND_PORT:-4200}:4000"
    environment:
      NODE_ENV: "production"
      PORT: "4000"
      BACKEND_URL: "http://backend:8080"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:4000', res => process.exit(res.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: pmhub-api:local
    container_name: pmhub-api
    depends_on:
      frontend:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "${PMHUB_API_PORT:-7081}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Production}"
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "${PMHUB_CONNECTION_STRING}"
    volumes:
      - pmhub_uploads:/app/wwwroot/uploads
      - pmhub_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && grep -q \"200 OK\" <&3'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  pmhub_uploads:
  pmhub_logs:
